services:
  - type: web
    name: sols-rng-dark-fantasy
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_PATH
        value: /var/data/solsrng.sqlite3
    disk:
      name: sols-rng-data
      mountPath: /var/data
      sizeGB: 1
